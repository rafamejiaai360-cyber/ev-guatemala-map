name: Migración D1 (una vez) — page_views

# Workflow temporal para aplicar db/schema.sql (idempotente, todo IF NOT EXISTS)
# contra la base de datos de producción, ya que no hay acceso directo a
# Cloudflare fuera de GitHub Actions. Se borra en cuanto corre con éxito.
on:
  push:
    branches: [claude/visit-counter-admin]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx wrangler d1 execute ev-guatemala-db --remote --file=db/schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

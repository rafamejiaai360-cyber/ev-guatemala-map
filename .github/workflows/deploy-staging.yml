name: Deploy a staging

# Solo se dispara a mano (Actions → Deploy a staging → Run workflow),
# nunca en push. Publica al ambiente aislado [env.staging] de
# wrangler.toml — nunca toca producción. Requiere el mismo secreto
# CLOUDFLARE_API_TOKEN que ya usa deploy.yml.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Deploy con Wrangler (staging)
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
